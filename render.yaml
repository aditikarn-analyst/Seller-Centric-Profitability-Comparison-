# Render Blueprint — FastAPI backend for the Marketplace Profitability Analyzer.
#
# The database is EXTERNAL (Neon Postgres), so it is not defined here — you set
# DATABASE_URL in the dashboard. Frontend is deployed separately on Vercel.
# Blueprint spec: https://render.com/docs/blueprint-spec  ·  see DEPLOYMENT.md
services:
  - type: web
    name: mpa-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Paid instances only — runs before every deploy. On the FREE plan this is
    # ignored, so initialize the database once in the Render Shell instead:
    #   alembic upgrade head && python -m app.db.seed
    # preDeployCommand: alembic upgrade head && python -m app.db.seed

    envVars:
      - key: DATABASE_URL          # Neon string: postgresql://...:...@...neon.tech/neondb?sslmode=require
        sync: false                # set in dashboard (secret)
      - key: JWT_SECRET_KEY        # strong secret, generated by Render
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS          # your Vercel URL, e.g. https://your-app.vercel.app (no trailing slash)
        sync: false
